apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel-gateway-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    namespace: cloudflare-tunnel-system
    server: "https://kubernetes.default.svc"
  sources:
    # TEMPORARY master build (PR #1017, f2228d88 tree) to verify the
    # cloudflared 2026.10.0 QUIC changes. Revert to the ghcr.io/lexfrei/charts
    # 5.0.0 release afterwards.
    - chart: cloudflare-tunnel-gateway-controller
      repoURL: ttl.sh
      targetRevision: 0.0.0-pr.1017-1d
      helm:
        valuesObject:
          image:
            repository: ttl.sh/cf-tunnel-gateway-ctrl
            digest: sha256:14da4050f2932c0f79479d2d3741ece946615bfb77721f87c2125eb36e6cf512
          controller:
            clusterDomain: "k8s.home.lex.la"
          gatewayClassConfig:
            create: true
            tunnelID: "59db961d-3851-468a-bf80-4d39f942b9e0"
            cloudflareCredentialsSecretRef:
              name: "cloudflare-credentials"
          proxy:
            image:
              repository: ttl.sh/cf-tunnel-gateway-proxy
              digest: sha256:911116e340eee50617f0ca2258cf513e3f27157897fc1fbbe2e494174ba5841a
            tunnelTokenSecretRef:
              name: "cloudflare-tunnel-token"
    - path: manifests/cloudflare-tunnel-gateway-controller
      repoURL: https://github.com/lexfrei/k8s.git
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
