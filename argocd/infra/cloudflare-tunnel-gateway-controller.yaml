apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel-gateway-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    namespace: cloudflare-tunnel-system
    server: "https://kubernetes.default.svc"
  sources:
    # TEMPORARY v5.0.0 release candidate (PR #989 build of 201257db).
    # Revert to the ghcr.io/lexfrei/charts release once v5.0.0 is tagged.
    - chart: cloudflare-tunnel-gateway-controller
      repoURL: ttl.sh
      targetRevision: 0.0.0-pr.989-1d
      helm:
        valuesObject:
          image:
            repository: ttl.sh/cf-tunnel-gateway-ctrl
            digest: sha256:5b3d275e303b5d55445e73df15205df74b04207f2febe7ac6f30ac42f8822cae
          controller:
            clusterDomain: "k8s.home.lex.la"
          gatewayClassConfig:
            create: true
            tunnelID: "59db961d-3851-468a-bf80-4d39f942b9e0"
            cloudflareCredentialsSecretRef:
              name: "cloudflare-credentials"
          proxy:
            image:
              repository: ttl.sh/cf-tunnel-gateway-proxy
              digest: sha256:519225053525f374c0fdac57e295ee20ff26c6db3dfbfaa418e75f7c0e118472
            tunnelTokenSecretRef:
              name: "cloudflare-tunnel-token"
    - path: manifests/cloudflare-tunnel-gateway-controller
      repoURL: https://github.com/lexfrei/k8s.git
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
