apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel-gateway-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  destination:
    namespace: cloudflare-tunnel-system
    server: "https://kubernetes.default.svc"
  sources:
    # TEMPORARY v6.0.0 release candidate (master f84cd4d9) to verify
    # port/scheme listener matching. Images were built locally and imported
    # into the node's containerd. Revert to the ghcr.io/lexfrei/charts
    # release afterwards.
    - path: charts/cloudflare-tunnel-gateway-controller
      repoURL: https://github.com/lexfrei/cloudflare-tunnel-gateway-controller.git
      targetRevision: f84cd4d9cdb9264f80c8a7a337e6dbcf0b00a3b8
      helm:
        valuesObject:
          image:
            repository: localhost/cftgc-controller
            tag: rc-f84cd4d9
          controller:
            clusterDomain: "k8s.home.lex.la"
          gatewayClassConfig:
            create: true
            tunnelID: "59db961d-3851-468a-bf80-4d39f942b9e0"
            cloudflareCredentialsSecretRef:
              name: "cloudflare-credentials"
          proxy:
            image:
              repository: localhost/cftgc-proxy
              tag: rc-f84cd4d9
            tunnelTokenSecretRef:
              name: "cloudflare-tunnel-token"
    - path: manifests/cloudflare-tunnel-gateway-controller
      repoURL: https://github.com/lexfrei/k8s.git
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
