apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartctl-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  destination:
    namespace: monitoring
    server: "https://kubernetes.default.svc"
  sources:
    - repoURL: "https://prometheus-community.github.io/helm-charts"
      targetRevision: "0.17.1"
      chart: prometheus-smartctl-exporter
      helm:
        valuesObject:
          config:
            # Every disk except the USB stick, which only chain-loads GRUB and
            # exposes no SMART data. include and exclude are mutually
            # exclusive, so listing the exclusion covers future disk swaps
            # without editing this file.
            device_exclude: "/dev/sde"
          serviceMonitor:
            enabled: true
            interval: 60s
            scrapeTimeout: 30s
          # Ships alerts for media errors, controller warnings, spare
          # exhaustion and overall device status.
          prometheusRules:
            enabled: true
            rules:
              # The system SSD negotiates 3.0 Gb/s against its own 6.0 Gb/s
              # capability, so this fires permanently. It is a port limit, not
              # a fault: the drive sits on the onboard Intel C222 controller,
              # where only the first two ports run at 6 Gb/s, and the remaining
              # SATA ports are not available for it. The pool disks are on the
              # HBA deliberately and are not moving to the chipset controller.
              # No ata errors and no kernel link-speed downgrades accompany it,
              # so there is nothing here to act on.
              smartCTLDInterfaceSlow:
                enabled: false
          nodeSelector:
            kubernetes.io/os: linux
          tolerations:
            - operator: Exists
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
