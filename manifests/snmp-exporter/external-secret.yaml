apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snmp-exporter-auth
    template:
      engineVersion: v2
      data:
        # UniFi OS takes a single SNMPv3 password and uses it for both
        # auth (SHA) and priv (AES).
        auth.yml: |
          auths:
            udr7:
              version: 3
              security_level: authPriv
              username: {{ .username | quote }}
              auth_protocol: SHA
              password: {{ .password | quote }}
              priv_protocol: AES
              priv_password: {{ .password | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/udr7-snmp
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/udr7-snmp
        property: password
