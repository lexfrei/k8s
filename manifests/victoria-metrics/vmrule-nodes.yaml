apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: nodes
  namespace: monitoring
spec:
  groups:
    - name: node-health
      rules:
        - alert: NodeRebooted
          expr: >-
            ((time() - node_boot_time_seconds) < 900)
            * on(instance) group_left(nodename) node_uname_info
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.nodename }} rebooted"
            description: >-
              Node {{ $labels.nodename }} ({{ $labels.instance }}) uptime
              is less than 15 minutes, indicating a recent reboot.
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: >-
              Node {{ $labels.node }} has been in NotReady state
              for more than 2 minutes.
        - alert: NodeUnreachable
          expr: >-
            (up{job=~".*node-exporter.*"} == 0)
            * on(instance) group_left(nodename)
            last_over_time(node_uname_info[1h])
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.nodename }} unreachable"
            description: >-
              node-exporter on {{ $labels.nodename }}
              ({{ $labels.instance }}) has been unreachable for more
              than 1 minute. Possible network failure (macb NIC death)
              or node crash.
        - alert: NodeMemoryUncorrectableErrors
          expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Uncorrectable ECC error on {{ $labels.instance }}"
            description: >-
              EDAC controller {{ $labels.controller }} on {{ $labels.instance }}
              reported an uncorrectable memory error within the last hour.
              Expect a panic or silent corruption; replace the DIMM.
        - alert: NodeMemoryCorrectableErrorsHigh
          expr: increase(node_edac_correctable_errors_total[24h]) > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ECC correctable errors accelerating on {{ $labels.instance }}"
            description: >-
              EDAC controller {{ $labels.controller }} on {{ $labels.instance }}
              corrected {{ $value | printf "%.0f" }} memory errors in 24h.
              A few per day is background; above 10 per day (the mcelog
              page-offline threshold) a DIMM is degrading.
        - alert: EtcdBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{cronjob="etcd-backup"} > 2 * 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "etcd backup has not succeeded for 2 days"
            description: >-
              CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} last succeeded
              {{ $value | humanizeDuration }} ago. A pod stuck Pending under
              concurrencyPolicy Forbid skips every later run without a failed job.
