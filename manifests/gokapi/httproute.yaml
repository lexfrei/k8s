apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gokapi
  namespace: gokapi
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  # Split horizon: the same hostname resolves to the internal Gateway on the
  # home network and to the tunnel from anywhere else, so local uploads never
  # leave the LAN while share links still work for everyone.
  parentRefs:
    - name: cilium-gateway-internal
      namespace: kube-system
      sectionName: https-lex-la
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - share.lex.la
  rules:
    # Gokapi answers / with a meta-refresh to /index, which meta-refreshes on
    # to the configured redirect target. Sending / straight to /admin collapses
    # both hops into one 302.
    - name: root-to-admin
      matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            # Without an explicit scheme the port is taken from the listener
            # and lands in the Location header as a literal :443.
            scheme: https
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin
            statusCode: 302
    - name: app
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gokapi
          port: 53842
