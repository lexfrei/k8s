apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gokapi
  namespace: gokapi
spec:
  parentRefs:
    - name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: https
  hostnames:
    - share.lex.la
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gokapi
          port: 53842
