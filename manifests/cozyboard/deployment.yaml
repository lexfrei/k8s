apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozyboard
  namespace: cozyboard
  labels:
    app.kubernetes.io/name: cozyboard
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cozyboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cozyboard
    spec:
      containers:
        - name: cozyboard
          # Upstream CI publishes only `latest` and `main-<short-sha>` — no
          # semver tags, so renovate cannot track this. Bump by hand.
          image: ghcr.io/lexfrei/cozyboard:main-6ff9ea0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # The image sets the same uid numerically; stated here too so the
            # pod does not silently follow a future base-image change.
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            # Bun writes transpiler cache under /tmp; root fs is read-only.
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
