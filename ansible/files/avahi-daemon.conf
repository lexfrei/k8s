# Avahi daemon configuration for Samba mDNS advertisement
# Managed by Ansible (ansible/playbooks/samba.yaml)

[server]
host-name=NAS
use-ipv4=yes
use-ipv6=no
# Avahi matches interface names only — no subnet form available. Predictable
# names encode the PCI slot, so this list needs updating whenever a NIC moves
# to another slot. Keeping it explicit rather than dropping the option, since
# without it avahi would also advertise on the pod network.
allow-interfaces=ens3f0,ens3f1,eno1,eno2
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-aaaa-on-ipv4=no

[reflector]
enable-reflector=no

[rlimits]
