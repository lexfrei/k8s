# Uplink configuration for the storage node.
# Managed by Ansible (ansible/roles/node-prep/tasks/netplan.yml)
#
# Interface matching:
#   Onboard NICs keep stable names (eno1/eno2) and are matched by name.
#   The SFP+ card is matched by driver plus port suffix instead: predictable
#   names encode the PCI slot, so the same card is ens2f0 in slot 2 and ens3f0
#   in slot 3. A plain name entry stops matching after any reseat, leaving the
#   port unconfigured and down — which is exactly how it failed once already.
#
# Route metrics decide which link carries egress when several are up. The 10G
# port must win. Equal metrics make the default route non-deterministic and can
# split the node across uplinks — k3s node-ip pinned to the address on one NIC
# while traffic leaves through another, which breaks the etcd member peer URL.
network:
  version: 2
  ethernets:
    # HP 560SFP+ (Intel 82599ES, ixgbe) — 10G, primary uplink.
    sfp10g-p0:
      match:
        driver: "ixgbe"
        name: "*f0"
      dhcp4: true
      optional: true
      # The uplink terminates on the router, so a router reboot is a carrier
      # loss here. Without these two networkd drops the DHCP lease on the
      # spot and the node loses its pinned address for the whole reboot;
      # kubelet fails nodeIP validation and every controller loses its
      # leader lease. ignore-carrier keeps the configuration across the
      # carrier loss (IgnoreCarrierLoss), critical keeps the DHCP address
      # across networkd restarts and lease expiry (KeepConfiguration).
      ignore-carrier: true
      critical: true
      dhcp4-overrides:
        route-metric: 100

    # The remaining ports are cabled to a test router on the bench (its LAN,
    # WAN and SFP cage). The router runs its own DHCP server and sends RAs,
    # so DHCP here handed the node a second default route into the test
    # network after every reboot. Links stay up with IPv6 link-local only:
    # that is how the bench board is reached when its uplink is down, and
    # it adds no route.
    sfp10g-p1:
      match:
        driver: "ixgbe"
        name: "*f1"
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: [ipv6]
      optional: true

    # Onboard Broadcom BCM5720 — 1G, bench ports as above.
    eno2:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: [ipv6]
      optional: true

    eno1:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: [ipv6]
      optional: true
