---
# ZFS configuration for storage nodes
# Installs ZFS packages and configures ARC memory limit
# Only runs on nodes in the 'storage' group

- name: Install ZFS packages
  ansible.builtin.apt:
    name:
      - zfsutils-linux
    state: present
  tags:
    - zfs
    - packages

- name: Configure ZFS module parameters
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    content: |
      # Ansible managed — see node_prep_zfs_module_params for the rationale
      # behind each value. Tunable at runtime without a reboot:
      #   echo VALUE > /sys/module/zfs/parameters/NAME
      options zfs {% for name, value in node_prep_zfs_module_params | dictsort %}{{ name }}={{ value }}{{ " " if not loop.last else "" }}{% endfor %}
    owner: root
    group: root
    mode: "0644"
  tags:
    - zfs

- name: Apply ZFS module parameters at runtime (no reboot needed)
  ansible.builtin.shell: |
    param=/sys/module/zfs/parameters/{{ item.key }}
    if [ ! -f "$param" ]; then
      echo "skipped (ZFS module not loaded or parameter absent)"
    elif [ "$(cat "$param")" != "{{ item.value }}" ]; then
      echo {{ item.value }} > "$param"
      echo "changed"
    else
      echo "ok"
    fi
  loop: "{{ node_prep_zfs_module_params | dict2items }}"
  register: zfs_param_result
  changed_when: "'changed' in zfs_param_result.stdout"
  tags:
    - zfs

- name: Enable ZFS auto-import
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - zfs-import-cache.service
    - zfs-mount.service
    - zfs.target
  failed_when: false
  tags:
    - zfs

- name: Verify ZFS pool status
  ansible.builtin.command: zpool status
  register: zpool_status
  changed_when: false
  failed_when: false
  tags:
    - zfs

- name: Display ZFS pool status
  ansible.builtin.debug:
    msg: "{{ zpool_status.stdout_lines | default(['No ZFS pools found']) }}"
  tags:
    - zfs
